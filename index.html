<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloghub · 代码与笔记</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./">Blog<span>hub</span><small>个人创作空间</small></a><nav><button id="home" class="active">我的文件</button><button id="settings">Python 环境</button></nav><input id="search" type="search" placeholder="搜索文件与内容…" aria-label="搜索文件"><button id="create" class="primary">＋ 新建文件</button></header>
<main><section class="intro"><div><p class="eyebrow">WRITE. BUILD. EXPLORE.</p><h1>记录想法，让代码运行。</h1><p>把灵感写成笔记，把思考变成代码。</p></div><button id="import">↥ 导入文件</button><input id="file" type="file" hidden accept=".md,.txt,.py,.js,.json,.html,.css,.ts,.sh,.yaml,.yml"></section>
<div class="layout"><aside><h2>文件库 <span id="count"></span></h2><div class="filters"><button data-filter="all" class="active">全部</button><button data-filter="md">Markdown</button><button data-filter="code">代码</button></div><div id="files"></div><p class="hint">文件保存在当前浏览器。重要内容请导出备份，不会自动上传到 GitHub。</p></aside>
<section class="workspace"><div class="toolbar"><input id="name" aria-label="文件名" placeholder="例如：笔记.md"><span id="saved" role="status"></span><button id="save">保存</button><button id="download">下载</button><button id="delete" class="danger">删除</button></div><div class="tabs"><button id="editTab" class="active">编辑</button><button id="previewTab">预览</button><span id="language"></span></div><textarea id="editor" spellcheck="false" aria-label="文件内容"></textarea><article id="preview" hidden></article><div class="runbar"><span id="connection">● 本地 Python 未连接</span><button id="run" class="primary">▷ 运行 Python</button></div><div class="console-head"><span>终端输出</span><button id="clear">清空</button></div><pre id="output" aria-live="polite">选择 Python 文件，连接本地环境后运行。</pre></section></div></main>
<dialog id="config"><form method="dialog"><div class="dialog-head"><h2>本地 Python 环境</h2><button aria-label="关闭">×</button></div></form><p>先运行项目中的 <code>python runner.py</code>，再填入终端显示的连接密钥。无需注册或登录。</p><label>连接密钥<input id="token" type="password" autocomplete="off" placeholder="仅在本次页面会话使用"></label><button id="connect" class="primary">连接本地服务</button><label>可用环境<select id="environment"></select></label><label>添加解释器的完整路径<input id="pythonPath" placeholder="D:\项目\.venv\Scripts\python.exe"></label><button id="addEnvironment">添加环境</button><p id="configStatus" role="status"></p><p class="hint">代码会以你的本机权限运行，请只执行可信代码。网页无法直接读取电脑环境，需要本地服务；如果浏览器阻止连接，请使用服务提供的本地网址。</p></dialog>
<div id="notice" role="status"></div><script src="app.js"></script></body></html>
