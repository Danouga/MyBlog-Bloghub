<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloghub · 代码与笔记</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="./">Blog<span>hub</span><small>个人创作空间</small></a><nav><button id="home" class="active">我的文件</button></nav><input id="search" type="search" placeholder="搜索文件与内容…" aria-label="搜索文件"><button id="create" class="primary">＋ 新建文件</button></header>
<main><section class="intro"><div><p class="eyebrow">WRITE. BUILD. EXPLORE.</p><h1>记录想法，让代码运行。</h1><p>把灵感写成笔记，把思考变成代码。</p></div><button id="import">↥ 导入文件</button><input id="file" type="file" hidden accept=".md,.txt,.py,.js,.json,.html,.css,.ts,.sh,.yaml,.yml"></section>
<div class="layout"><aside><h2>文件库 <span id="count"></span></h2><div class="filters"><button data-filter="all" class="active">全部</button><button data-filter="md">Markdown</button><button data-filter="code">代码</button></div><div id="files"></div><p class="hint">文件保存在当前浏览器。重要内容请导出备份，不会自动上传到 GitHub。</p></aside>
<section class="workspace"><div class="toolbar"><input id="name" aria-label="文件名" placeholder="例如：笔记.md"><span id="saved" role="status"></span><button id="save">保存</button><button id="download">下载</button><button id="delete" class="danger">删除</button></div><div class="tabs"><button id="editTab" class="active">编辑</button><button id="previewTab">预览</button><span id="language"></span></div><textarea id="editor" spellcheck="false" aria-label="文件内容"></textarea><article id="preview" hidden></article><div class="runbar"><span id="connection">● 浏览器 Python · 无需连接</span><button id="run" class="primary">▷ 运行 Python</button></div><div class="console-head"><span>终端输出</span><button id="clear">清空</button></div><pre id="output" aria-live="polite">选择 Python 文件，直接在浏览器中运行。</pre></section></div></main>

<div id="notice" role="status"></div><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="python.css"><script src="app.js"></script><script src="library.js"></script><script src="browser-python.js"></script></body></html>
